name: Weekly Regression Check

on:
  schedule:
    - cron: "0 12 * * 1" # every Monday, 12:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npx vsce package
